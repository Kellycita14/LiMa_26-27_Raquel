<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <meta name="author" content="Raquel"/>
        <meta name="description" content="html"/>
        <meta name="keywords" content="html"/>
        <title>Formulario de rexistro</title>
    </head>
    <body>
        <form method="get" action="">
            <label for="name">Nome:</label>
            <br/>
            <input type="text" id="name" name="name" maxlength="50"/>
            <br/>
            <br/>
            <label for="surname">Apelidos:</label>
            <br/>
            <input type="text" id="surname" name="surname" maxlength="50"/>
            <br/>
            <br/>
            <label>Sexo:</label>
            <br/>
            <input type="radio" id="man" name="sex" value="home"/>
            <label for="man">Home</label>
            <input type="radio" id="woman" name="sex" value="muller"/>
            <label for="woman">Muller</label>
            <br/>
            <br/>
            <label for="email">Correo electrónico: </label>
            <br/>
            <input type="emial" id="email" name="email"/>
            <br/>
            <br/>
            <label for="city">Poboación:</label>
            <br/>
            <select id="city" name="city">
                <option value="coruna">A Coruña</option>
                <option value="lugo">Lugo</option>
                <option value="ourense">Ourense</option>
                <option value="pontevedra">Pontevedra</option>
            </select>
            <br/>
            <br/>
            <input type="checkbox" id="info" name="info" value="si" checked="checked"/>
            <label for="info">Desexo recibir información sobre novidades e ofertas</label>
            <br/>
            <br/>
            <input type="checkbox" id="conditions" name="conditions" value="si"/>
            <label for="conditions">Declaro aceptar as condicións xerais do programa e a normativa sobre protección de datos</label>
            <br/>
            <br/>
            <input type="submit" value="Enviar"/>
        </form>
    </body>
</html>
