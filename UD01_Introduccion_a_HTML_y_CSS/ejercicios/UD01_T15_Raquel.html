<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="author" content="Raquel" />
    <meta name="description" content="html" />
    <meta name="keywords" content="html" />
    <title>Tabla con selectores</title>
    <style>
        table {
            width: 50%;
            border: 2px solid black;
            border-collapse: collapse;
        }

        td {
            border: 2px solid black;
            text-align: center;
            height: 30px;
            width: 40px;
        }

        tr:nth-child(7n+1) td {
            background-color: red;
        }

        tr:nth-child(7n+2) td {
            background-color: orange;
        }

        tr:nth-child(7n+3) td {
            background-color: yellow;
        }

        tr:nth-child(7n+4) td {
            background-color: limegreen;
        }

        tr:nth-child(7n+5) td {
            background-color: deepskyblue;
        }

        tr:nth-child(7n+6) td {
            background-color: #0078D7;
        }

        tr:nth-child(7n) td {
            background-color: blueviolet;
        }
    </style>
</head>

<body>
    <table>
        <tbody>
            <tr>
                <td rowspan="3">1</td>
                <td rowspan="2"></td>
                <td colspan="2"></td>
                <td rowspan="3"></td>
                <td colspan="2"></td>
            </tr>
            <tr>
                <td>2</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td colspan="2">3</td>
                <td></td>
                <td></td>
                <td rowspan="3"></td>
            </tr>
            <tr>
                <td>4</td>
                <td colspan="2"></td>
                <td colspan="3"></td>
            </tr>
            <tr>
                <td>5</td>
                <td colspan="2"></td>
                <td rowspan="2"></td>
                <td colspan="2"></td>
            </tr>
            <tr>
                <td>6</td>
                <td colspan="2"></td>
                <td colspan="3"></td>
            </tr>
            <tr>
                <td rowspan="4">7</td>
                <td colspan="2" rowspan="2"></td>
                <td></td>
                <td colspan="3"></td>
            </tr>
            <tr>
                <td rowspan="3">8</td>
                <td colspan="3" rowspan="3"></td>
            </tr>
            <tr>
                <td>9</td>
                <td></td>
            </tr>
            <tr>
                <td>10</td>
                <td></td>
            </tr>
            <tr>
                <td>11</td>
                <td colspan="4"></td>
                <td></td>
                <td rowspan="2"></td>
            </tr>
            <tr>
                <td colspan="3">12</td>
                <td></td>
                <td rowspan="2"></td>
                <td rowspan="2"></td>
            </tr>
            <tr>
                <td colspan="3" rowspan="5">13</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>14</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>15</td>
                <td></td>
                <td colspan="2" rowspan="2"></td>
            </tr>
            <tr>
                <td rowspan="3">16</td>
                <td rowspan="3"></td>
            </tr>
            <tr>
                <td colspan="2">17</td>
            </tr>
            <tr>
                <td>18</td>
                <td colspan="2"></td>
                <td colspan="2"></td>
            </tr>
            <tr>
                <td>19</td>
                <td colspan="6"></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
