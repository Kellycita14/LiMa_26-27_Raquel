<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="author" content="Raquel" />
        <meta name="description" content="html" />
        <meta name="keywords" content="html" />
        <link rel="stylesheet" content="text/css" href="style.css" />
    </head>

    <body>
        <main>
            <form id="music-form" action="#" method="post">
                <section>
                    <h3>Validación de formularios</h3>
                    <input type="text" id="name" name="nombre" placeholder="Nome" required="required" />

                    <input type="text" id="email" name="correo_electronico" placeholder="Email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" required="required" />

                    <input type="text" id="nickname" name="apodo" placeholder="Apodo" />

                    <input type="text" id="band" name="grupo-musica" placeholder="Grupo de música favorito" />
                </section>
            </form>
        </main>
    </body>
</html>
